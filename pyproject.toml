[project]
name = "comment-monitor"
version = "0.1.0"
description = "유튜브 댓글을 수집하고 악성 댓글의 증거를 정리하는 로컬 도구"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "openpyxl",
    "Pillow",
    "playwright",
    "python-dotenv",
    "PyYAML",
    "tzdata; sys_platform == 'win32'",
]

[project.scripts]
comment-monitor = "comment_monitor.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comment_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
