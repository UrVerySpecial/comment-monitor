# 이 파일을 config.yaml로 복사한 뒤 값을 채운다.
# 항목 이름을 잘못 적으면 실행 시 오류로 알려준다.

targets:                                 # 한 명 이상. AI 판정의 "대상" 값이 된다
  - name: "가수 이름"                    # 엑셀과 랭킹에 이 이름 그대로 나온다
    aliases: ["예명", "별명"]            # AI가 이 대상을 알아보는 데 쓰는 다른 이름
    note: "그룹명의 보컬"                # AI에게 주는 설명 (선택)
  - name: "그룹명"
    aliases: ["그룹 영문명"]
    note: "그룹. 특정 멤버가 아니라 그룹 전체를 향한 댓글"

youtube:
  videos: ["https://www.youtube.com/watch?v=xxxxxxxxxxx"]   # 직접 지정 (최우선)
  channels: []                           # 이 채널들의 영상. UC로 시작하는 채널 ID
  channel_max_videos: 100                # 채널당 최신 N개
  search:
    enabled: false                       # 초기에는 꺼 둠
    default_top_n: 20                    # 키워드당 상위 N개 영상
    order: relevance                     # relevance(관련도) | viewCount(조회수) | date(최신)
    published_after: "2026-01-01"
    cache_days: 7                        # 같은 검색을 다시 하지 않는 기간
    keywords:
      - "가수 이름"
      - { q: "가수 이름 논란", top_n: 10, order: viewCount }   # 키워드별로 다르게
  exclude_videos: []                     # 대상에서 계속 제외할 영상
  daily_quota_budget: 8000               # 이 값을 넘기 전에 수집을 멈춤

limits:
  max_videos_per_run: 50                 # 댓글이 많은 영상부터 N개만 처리 (--max-videos로 덮어씀)
  max_comments_per_video: 20000          # 넘으면 최신순 부분 수집
  full_rescan_max_comments: 5000         # 이하인 영상만 매번 전체 재확인
  max_classify_per_run: 5000
  max_captures_per_run: 300
  confirm_cost_over_krw: 10000           # 예상 분류 비용이 넘으면 확인 질문

classifier:
  model: "claude-opus-5-5"               # 분류 모델 (2단 분류에서는 최종 판정)
  first_pass_model: "claude-haiku-5-5"   # 2단 분류(run --two-pass)의 1차 분류
  batch_size: 20
  prompt_version: "v1"

capture:
  min_severity: 2                        # 이 심각도 이상의 부정 댓글만 캡처
  # targets: ["가수 이름", "불명"]       # 적지 않으면 타인을 제외한 전부 (대상 전원과 불명)
  headless: true

export:
  path: "output/댓글증거.xlsx"
  include_all_comments: false            # true면 긍정, 중립 포함 전체 탭 추가
